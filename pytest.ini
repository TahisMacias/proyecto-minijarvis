[pytest]
# pythonpath = . anade la raiz del repositorio a sys.path durante las pruebas.
# Sin esta linea, `pytest tests/test_memory.py` falla con "No module named 'core'":
# pytest solo agrega la carpeta de las pruebas, no la del proyecto. Con ella, el
# comando documentado en el plan funciona tal cual, sin instalar el paquete ni
# obligar a escribir `python -m pytest`.
pythonpath = .
testpaths = tests
